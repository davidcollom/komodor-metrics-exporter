# Every setting can also be a flag or a KOMODOR_* env var; those override this file.
poll-interval: 5m
request-timeout: 2m
concurrency: 8
log-level: info
log-format: json

# Every metric group is on by default. Set one to false to stop collecting it:
# its API calls are skipped and its series are not exposed.
metrics:
  clusters: true        # komodor_clusters
  risks: true           # komodor_reliability_risks{status,severity}
  risks_active: true    # komodor_reliability_risks_active{cluster,severity}
  risks_by_check: true  # komodor_reliability_risks_by_check{check_type}
  issues: true          # komodor_issues_open, komodor_issues_closed_total

# Issue queries can be narrowed. skip-issues takes cluster/type pairs (either side may be *),
# useful when the API fails for one pair. issue-types selects which types are queried at all.
# skip-issues: [homelab/node-issue, "*/workflow-issue"]
# issue-types: [availability, failed-deploy]
