# Run from this directory: KOMODOR_API_KEY=... docker compose up --build
# Grafana http://localhost:3000 (admin / demo), Prometheus http://localhost:9091, exporter http://localhost:9092/metrics
services:
  exporter:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    environment:
      KOMODOR_API_KEY: ${KOMODOR_API_KEY:?set KOMODOR_API_KEY}
      KOMODOR_POLL_INTERVAL: 1m
      KOMODOR_LOG_LEVEL: ${KOMODOR_LOG_LEVEL:-info}
      KOMODOR_SKIP_ISSUES: ${KOMODOR_SKIP_ISSUES:-}
    ports: ["9092:9090"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9091:9090"]
    depends_on: [exporter]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      # A real login: with anonymous access Grafana answers 401 to /api/user/preferences on every page load.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: demo
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  prometheus-data:
