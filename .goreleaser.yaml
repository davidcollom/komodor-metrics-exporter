version: 2
project_name: komodor-metrics-exporter

builds:
  - env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: [ghcr.io/davidcollom/komodor-metrics-exporter]
    tags: ["{{.Version}}", latest]
    platforms: [linux/amd64, linux/arm64]

changelog:
  sort: asc
  groups:
    - {title: Features, regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$', order: 0}
    - {title: Fixes, regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$', order: 1}
    - {title: Other, order: 999}
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "^ci:"]
