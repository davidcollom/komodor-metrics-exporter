{{- if not .Values.existingSecret }}
{{- $_ := required "set apiKey, or existingSecret to the name of a Secret holding the Komodor API key" .Values.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kme.fullname" . }}
  labels: {{- include "kme.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecretKey }}: {{ .Values.apiKey | quote }}
{{- end }}
