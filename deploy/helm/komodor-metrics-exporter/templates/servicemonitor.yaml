{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kme.fullname" . }}
  labels:
    {{- include "kme.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "kme.selector" . | nindent 6 }}
  endpoints:
    - {port: metrics, interval: {{ .Values.serviceMonitor.interval }}}
{{- end }}
