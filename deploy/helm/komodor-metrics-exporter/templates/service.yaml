apiVersion: v1
kind: Service
metadata:
  name: {{ include "kme.fullname" . }}
  labels: {{- include "kme.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "kme.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: {{ .Values.service.port }}, targetPort: metrics}
