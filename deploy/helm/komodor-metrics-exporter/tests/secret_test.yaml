suite: secret
templates: [templates/secret.yaml]
tests:
  - it: creates a Secret from apiKey
    set: {apiKey: abc}
    asserts:
      - isKind: {of: Secret}
      - equal: {path: stringData.api-key, value: abc}

  - it: uses existingSecretKey as the Secret key
    set: {apiKey: abc, existingSecretKey: token}
    asserts:
      - equal: {path: stringData.token, value: abc}

  - it: renders nothing when an existing Secret is named
    set: {existingSecret: mine}
    asserts:
      - hasDocuments: {count: 0}

  - it: fails with neither apiKey nor existingSecret
    asserts:
      - failedTemplate:
          errorPattern: set apiKey, or existingSecret
